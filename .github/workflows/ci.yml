name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatbot_user
          POSTGRES_PASSWORD: chatbot_pass
          POSTGRES_DB: society_chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Automated Pytest Suite
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./test_ci.db
          GEMINI_API_KEY: mock-ci-key
        run: |
          pytest -v tests/
