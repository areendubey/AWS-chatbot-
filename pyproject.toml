[project]
name = "society-chatbot"
version = "1.0.0"
description = "Production-ready society chatbot backend with RAG, Qdrant vector retrieval, Google Gemini, and escalation management."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Areen Dubey", email = "areendubey0704@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "google-generativeai>=0.8.3",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "python-jose[cryptography]>=3.3.0",
    "google-auth>=2.36.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
